[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-path-compiler"
version = "1.0.0"
description = "Security Digital Twin, Bayesian Edge Engine, and Attack Path Compiler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "networkx>=3.2.1",
    "sqlalchemy>=2.0.28",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "ortools>=9.9.3963"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]
